compliance_rules:
  - feature_slug: aaa
    platform_network_driver: arista_eos
    config_ordered: false
    match_config: |
      aaa
      no aaa
    config_type: cli
    config_remediation: true
  - feature_slug: username
    platform_network_driver: arista_eos
