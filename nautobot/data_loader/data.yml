    a_interface: Ethernet1
    b_device: leaf1
    b_interface: Ethernet1
    type: cat6
    status: Connected
  - a_device: spine1
    a_interface: Ethernet2
    b_device: leaf2
    b_interface: Ethernet1
    type: cat6
    status: Connected
  - a_device: spine1
    a_interface: Ethernet3
    b_device: leaf3
    b_interface: Ethernet1
    type: cat6
    status: Connected
  - a_device: spine2
    a_interface: Ethernet1
    b_device: leaf1
    b_interface: Ethernet2
    type: cat6
    status: Connected
  - a_device: spine2
    a_interface: Ethernet2
    b_device: leaf2
