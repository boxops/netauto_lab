---
# Alertmanager configuration
#
# Slack notifications: set ALERTMANAGER_SLACK_WEBHOOK and ALERTMANAGER_SLACK_CHANNEL
# in .env, then add --config.expand-env to the alertmanager command in docker-compose.yml
# and replace the webhook_configs below with slack_configs using ${ALERTMANAGER_SLACK_WEBHOOK}.
#
# The closed-loop-webhook receiver is the critical path — it drives the AI pipeline.
# All other receivers are no-ops unless you configure a notification backend.

global:
  resolve_timeout: 5m
  smtp_from: 'alerts@lab.local'
  smtp_smarthost: 'localhost:25'

# Alert routing
route:
  group_by: ['alertname', 'severity', 'category']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    # AI pipeline: every critical/warning alert hits the closed-loop webhook first
    - match_re:
        severity: critical|warning
      receiver: closed-loop-webhook
      continue: true
    - match:
        severity: critical
      receiver: critical-alerts
      repeat_interval: 1h
    - match:
        category: routing
      receiver: network-team
    - match:
        category: availability
      receiver: network-team

# Receivers
receivers:
  # No-op default — add slack_configs here once a webhook URL is configured
  - name: default

  # No-op for critical — add paging/slack here once configured
  - name: critical-alerts

  # No-op for network team — add routing once configured
  - name: network-team

  - name: closed-loop-webhook
    webhook_configs:
      # Primary: deliver directly to ops agent for zero-polling latency
      - url: 'http://ai-agent:8000/webhook/alert'
        send_resolved: true
        max_alerts: 0
        # ── Webhook authentication (recommended outside the lab) ──
        # The agent rejects unauthenticated alerts when ALERT_WEBHOOK_SECRET is
        # set in .env. To make Alertmanager send the matching credential:
        #   1. Write the same secret (single line) to prometheus/webhook_secret
        #      (gitignored)
        #   2. Mount it in docker-compose.yml under the alertmanager service:
        #        - ./prometheus/webhook_secret:/etc/alertmanager/webhook_secret:ro
        #   3. Uncomment:
        # http_config:
        #   authorization:
        #     type: Bearer
        #     credentials_file: /etc/alertmanager/webhook_secret
      # Audit log: also feed the event receiver for historical record
      - url: 'http://alert-event-receiver:8770/alertmanager/webhook'
        send_resolved: true
        max_alerts: 0

# Inhibition rules — scope per device using sysName so a critical on one device
# does not suppress warnings on a different device (all share instance=telegraf:9273)
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['sysName']
