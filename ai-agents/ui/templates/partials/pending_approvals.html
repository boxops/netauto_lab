{% if count > 0 %}
<span style="display:inline-flex;align-items:center;justify-content:center;
             background:#a855f7;color:#fff;border-radius:10px;
             font-size:0.65em;font-weight:700;padding:1px 6px;
             margin-left:5px;min-width:18px;line-height:1.4;
             animation:pulse 2s infinite">{{ count }}</span>
{% endif %}
