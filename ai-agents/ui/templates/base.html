<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Clano{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/htmx.min.js"></script>
    <script>
      // Apply help-text preference before body renders to avoid flash
      if (localStorage.getItem("clano-help-texts") === "0") {
        document.documentElement.classList.add("no-help");
      }
    </script>
  </head>
  <body>
    <div class="page-header">
      <div class="flex items-center gap-12 flex-wrap">
        <div>
          <h1>📡 Clano</h1>
          <p class="muted" style="font-size:0.82em; margin-top:2px">
            Closed-Loop Autonomous Network Ops · powered by AI agents
          </p>
        </div>
        {# Compact agent health badge — top-right corner #}
        <div style="margin-left:auto"
             id="status-bar"
             hx-get="/partials/status-bar"
             hx-trigger="load, every 30s"
             hx-swap="outerHTML">
          <span class="muted" style="font-size:0.78em">Checking…</span>
        </div>
      </div>
    </div>

    <nav class="nav-tabs">
      <a class="nav-tab {% if active_tab == 'pipeline' %}active{% endif %}" href="/">
        📡 Operations
        <span id="approval-badge"
              hx-get="/partials/pending-approvals"
              hx-trigger="load, sse-refresh"
              hx-swap="innerHTML"></span>
      </a>
      <a class="nav-tab {% if active_tab == 'incidents' %}active{% endif %}" href="/incidents">
        🚨 Incidents
      </a>
      <a class="nav-tab {% if active_tab == 'ops' %}active{% endif %}" href="/chat/ops">
        💬 Assist
      </a>
      <a class="nav-tab {% if active_tab == 'config' %}active{% endif %}" href="/config">
        ⚙️ Config
      </a>
      <a class="nav-tab {% if active_tab == 'system' %}active{% endif %}" href="/system">
        📊 System
      </a>
    </nav>

    <div class="content">{% block content %}{% endblock %}</div>

    <script>
      // ── SSE task-change stream ───────────────────────────────────────────────────
      (function () {
        var sse = null;
        var TARGETS = [
          "pipeline-chronicle",
          "task-queue-body",
          "approval-badge",
          "incident-list",
          "ops-health-bar",
        ];

        function connect() {
          sse = new EventSource("/stream/tasks");
          sse.addEventListener("tasks-changed", function () {
            TARGETS.forEach(function (id) {
              var el = document.getElementById(id);
              if (el) htmx.trigger(el, "sse-refresh");
            });
          });
          sse.onerror = function () {
            sse.close();
            setTimeout(connect, 5000);
          };
        }

        document.addEventListener("DOMContentLoaded", connect);
      })();
    </script>
  </body>
</html>
